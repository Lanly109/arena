<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Arena ONNX inference architecture</title>
  <desc id="desc">Panel a shows a Transformer generator with a two-layer encoder and a two-layer causal decoder. Python samples five attack units autoregressively. Panel b shows a two-layer Transformer encoder over a CLS token and two teams. Its six outcome logits are used to rank candidates for MZQ.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#42536a"/>
    </marker>
    <marker id="runtime-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#995b22"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172337; }
      .title { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: 33px; }
      .subtitle, .caption { font-size: 16px; fill: #42536a; }
      .panel-title { font-size: 22px; font-weight: 700; }
      .file, .tensor { font-family: Menlo, Consolas, monospace; font-size: 15px; }
      .file { fill: #42536a; }
      .label { font-size: 18px; font-weight: 700; }
      .detail { font-size: 16px; fill: #33445b; }
      .legend, .tiny { font-size: 14px; fill: #42536a; }
      .gen-bound { fill: #f8fafd; stroke: #8ba4c2; }
      .crit-bound { fill: #f8fbfa; stroke: #85a99e; }
      .gen-layer { fill: #e7eff8; stroke: #6888ae; }
      .crit-layer { fill: #e7f2ed; stroke: #659787; }
      .input { fill: #ffffff; stroke: #a4afbd; }
      .outside { fill: #fffaf2; stroke: #ad7844; stroke-dasharray: 6 4; }
      .box { stroke-width: 1.4; }
      .flow { fill: none; stroke: #42536a; stroke-width: 1.7; marker-end: url(#arrow); }
      .runtime { fill: none; stroke: #995b22; stroke-width: 1.6; stroke-dasharray: 5 4; marker-end: url(#runtime-arrow); }
      .tag-win { fill: #dbece4; stroke: #92b4a6; }
      .tag-other { fill: #eef0f4; stroke: #a7b2c0; }
      .tag { font-size: 14px; fill: #33445b; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <text class="title" x="40" y="47">Arena ONNX inference</text>
  <text class="subtitle" x="41" y="73">Autoregressive team generation and matchup scoring</text>
  <path d="M40 90 H1240" stroke="#c5cfdc" stroke-width="1.2"/>
  <rect class="gen-layer box" x="902" y="52" width="18" height="13" rx="2"/>
  <text class="legend" x="927" y="63">ONNX layer</text>
  <rect class="outside box" x="1045" y="52" width="18" height="13" rx="2"/>
  <text class="legend" x="1070" y="63">Python runtime</text>

  <g aria-label="Panel a, candidate generator">
    <text class="panel-title" x="40" y="124">(a) Candidate generator</text>
    <text class="file" text-anchor="end" x="618" y="124">generator.onnx</text>

    <rect class="gen-bound box" x="40" y="224" width="580" height="310" rx="10"/>
    <text class="tiny" x="54" y="243">ONNX GRAPH</text>

    <rect class="input box" x="55" y="149" width="240" height="54" rx="6"/>
    <text class="label center" x="175" y="172">Defense and goal</text>
    <text class="tensor center" x="175" y="191">opponents B×5 · goals B</text>

    <rect class="input box" x="350" y="149" width="246" height="54" rx="6"/>
    <text class="label center" x="473" y="172">Decoder prefix</text>
    <text class="tensor center" x="473" y="191">decoder_tokens B×5</text>

    <rect class="gen-layer box" x="55" y="255" width="240" height="58" rx="6"/>
    <text class="label center" x="175" y="279">Goal + unit embeddings</text>
    <text class="detail center" x="175" y="300">1 goal + 5 units · B×6×64</text>

    <rect class="gen-layer box" x="350" y="255" width="246" height="58" rx="6"/>
    <text class="label center" x="473" y="279">Unit embeddings</text>
    <text class="detail center" x="473" y="300">BOS + prefix + PAD · B×5×64</text>

    <rect class="gen-layer box" x="55" y="340" width="240" height="66" rx="6"/>
    <text class="label center" x="175" y="366">Encoder ×2</text>
    <text class="detail center" x="175" y="389">4-head self-attention · FFN 192</text>

    <rect class="gen-layer box" x="350" y="340" width="246" height="78" rx="6"/>
    <text class="label center" x="473" y="365">Decoder ×2</text>
    <text class="detail center" x="473" y="386">Causal self-attn + cross-attn</text>
    <text class="detail center" x="473" y="405">4 heads · FFN 192</text>

    <rect class="gen-layer box" x="350" y="451" width="246" height="65" rx="6"/>
    <text class="label center" x="473" y="474">Vocabulary projection</text>
    <text class="detail center" x="473" y="493">LayerNorm + tied embeddings</text>
    <text class="tensor center" x="473" y="510">logits · B×5×317</text>

    <path class="flow" d="M175 203 V252"/>
    <path class="flow" d="M473 203 V252"/>
    <path class="flow" d="M175 313 V337"/>
    <path class="flow" d="M473 313 V337"/>
    <path class="flow" d="M295 378 H347"/>
    <text class="tiny center" x="322" y="367">memory</text>
    <path class="flow" d="M473 418 V448"/>

    <rect class="outside box" x="55" y="562" width="541" height="69" rx="6"/>
    <text class="label center" x="325.5" y="590">Autoregressive sampling</text>
    <text class="detail center" x="325.5" y="614">Read step logits → apply legal mask → top-p → append one unit</text>
    <path class="runtime" d="M473 516 V559"/>
    <path class="runtime" d="M596 593 H629 V176 H599"/>
  </g>

  <g aria-label="Panel b, matchup critic">
    <text class="panel-title" x="660" y="124">(b) Matchup critic</text>
    <text class="file" text-anchor="end" x="1240" y="124">critic.onnx</text>

    <rect class="crit-bound box" x="660" y="224" width="580" height="310" rx="10"/>
    <text class="tiny" x="674" y="243">ONNX GRAPH</text>

    <rect class="input box" x="676" y="149" width="240" height="54" rx="6"/>
    <text class="label center" x="796" y="172">Attack candidate</text>
    <text class="tensor center" x="796" y="191">attacks B×5</text>

    <rect class="input box" x="978" y="149" width="240" height="54" rx="6"/>
    <text class="label center" x="1098" y="172">Defending team</text>
    <text class="tensor center" x="1098" y="191">defends B×5</text>

    <rect class="crit-layer box" x="716" y="255" width="468" height="58" rx="6"/>
    <text class="label center" x="950" y="279">CLS + five attackers + five defenders</text>
    <text class="detail center" x="950" y="300">Unit and side embeddings · B×11×64</text>

    <rect class="crit-layer box" x="783" y="340" width="334" height="60" rx="6"/>
    <text class="label center" x="950" y="365">Encoder ×2</text>
    <text class="detail center" x="950" y="387">4 heads · joint self-attention · FFN 192</text>

    <rect class="crit-layer box" x="783" y="422" width="334" height="55" rx="6"/>
    <text class="label center" x="950" y="444">CLS → LayerNorm → Linear</text>
    <text class="tensor center" x="950" y="466">outcomes · B×6 logits</text>

    <path class="flow" d="M796 203 V252"/>
    <path class="flow" d="M1098 203 V252"/>
    <path class="flow" d="M950 313 V337"/>
    <path class="flow" d="M950 400 V419"/>

    <g aria-label="Four winning time classes, loss, and timeout">
      <rect class="tag-win" x="676" y="494" width="84" height="25" rx="3"/>
      <rect class="tag-win" x="768" y="494" width="84" height="25" rx="3"/>
      <rect class="tag-win" x="860" y="494" width="84" height="25" rx="3"/>
      <rect class="tag-win" x="952" y="494" width="84" height="25" rx="3"/>
      <rect class="tag-other" x="1044" y="494" width="84" height="25" rx="3"/>
      <rect class="tag-other" x="1136" y="494" width="84" height="25" rx="3"/>
      <text class="tag center" x="718" y="511">Win 0–15s</text>
      <text class="tag center" x="810" y="511">Win 15–30s</text>
      <text class="tag center" x="902" y="511">Win 30–60s</text>
      <text class="tag center" x="994" y="511">Win 60–90s</text>
      <text class="tag center" x="1086" y="511">Loss</text>
      <text class="tag center" x="1178" y="511">Timeout</text>
    </g>

    <rect class="outside box" x="676" y="562" width="544" height="69" rx="6"/>
    <text class="label center" x="948" y="590">Candidate ranking</text>
    <text class="detail center" x="948" y="614">Softmax → FAST_ATTACK utility → top 32 to MZQ</text>
    <path class="runtime" d="M948 477 V559"/>
  </g>

  <path class="runtime" d="M325.5 631 V668 H649 V176 H673"/>
  <text class="caption center" x="488" y="659">5 selected IDs → Critic vocabulary</text>
  <path d="M40 685 H1240" stroke="#c5cfdc" stroke-width="1.2"/>
  <text class="caption" x="40" y="706">B: batch size. Each model uses its own unit vocabulary.</text>
</svg>
